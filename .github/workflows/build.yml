name: Build PixelAssist RP2350A Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          # Install directly to /usr/local/bin so it's on PATH for all steps
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Linux_64bit.tar.gz \
            | sudo tar -xz -C /usr/local/bin
          arduino-cli version

      - name: Add RP2040/RP2350 board package and install core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit TinyUSB Library"
          arduino-cli lib install "Pico PIO USB"

      - name: Patch TinyUSB config (large descriptors + 4 HID interfaces)
        run: |
          CFG=$(find ~/.arduino15 -name "tusb_config_rp2040.h" 2>/dev/null | head -1)
          if [ -n "$CFG" ]; then
            echo "Patching: $CFG"
            sed -i 's/\(#define[[:space:]]*CFG_TUH_ENUMERATION_BUFSIZE[[:space:]]*\)[0-9]*/\11024/' "$CFG"
            sed -i 's/\(#define[[:space:]]*CFG_TUD_HID[[:space:]]*\)[0-9]*/\14/'                  "$CFG"
            grep -E "CFG_TUH_ENUMERATION_BUFSIZE|CFG_TUD_HID" "$CFG"
          else
            echo "tusb_config_rp2040.h not found — skipping patch"
          fi

      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn "rp2040:rp2040:rpipico2:freq=240,usbstack=tinyusb" \
            --build-property "compiler.cpp.extra_flags=-DCFG_TUD_HID=4" \
            --output-dir build \
            sketch/PixelAssist_RP2350A

      - name: Locate UF2
        id: uf2
        run: |
          F=$(find build -name "*.uf2" ! -name "*bootloader*" | head -1)
          echo "path=$F" >> "$GITHUB_OUTPUT"
          echo "Found: $F  ($(stat -c%s "$F") bytes)"

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico2_mouse_bridge_uf2
          path: ${{ steps.uf2.outputs.path }}
          if-no-files-found: error
          retention-days: 90
