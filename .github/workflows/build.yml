name: Build Pico2 Mouse Bridge Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PICO_SDK_VERSION: "2.1.0"

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. ARM toolchain + build tools ──────────────────────────────────────
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            python3 git

      # ── 3. Clone pico-sdk with all required submodules ──────────────────────
      - name: Clone pico-sdk ${{ env.PICO_SDK_VERSION }}
        run: |
          git clone --depth=1 --branch ${{ env.PICO_SDK_VERSION }} \
            https://github.com/raspberrypi/pico-sdk.git /opt/pico-sdk
          cd /opt/pico-sdk
          # Core submodules needed
          git submodule update --init --depth=1 \
            lib/tinyusb \
            lib/Pico-PIO-USB \
            lib/cyw43-driver \
            lib/lwip \
            lib/mbedtls \
            src/rp2_common/boot_stage2
          # TinyUSB host/device submodules
          cd lib/tinyusb
          git submodule update --init --depth=1 hw/mcu/raspberry_pi/Pico-PIO-USB || true

      # ── 4. Configure ────────────────────────────────────────────────────────
      - name: Configure
        env:
          PICO_SDK_PATH: /opt/pico-sdk
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_PLATFORM=rp2350 \
            -DPICO_BOARD=pico2 \
            -G Ninja

      # ── 5. Build ────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --parallel

      # ── 6. Upload UF2 ───────────────────────────────────────────────────────
      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: pico2_mouse_bridge_uf2
          path: build/pico2_mouse_bridge.uf2
          if-no-files-found: error
          retention-days: 90
